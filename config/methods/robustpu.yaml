robustpu:
  metadata:
    method_key: "robustpu"
    trainer_key: "robustpu"
    alignment:
      level: "source_faithful_kernel_benchmark_wrapper"
      source_reproduction: false
      claim_note: "Controlled public-backbone PU-Bench wrapper of the Robust-PU two-stage nnPU-pretrain plus self-paced weighted-training kernel; not an exact private-backbone source reproduction."
      source_references:
        - "https://github.com/woriazzc/Robust-PU/tree/34d950f2c6e56510855a922acb5f84b6459773ef"
      retained_source_components:
        - "PU labels +1 for labeled positives and -1 for unlabeled samples"
        - "source README 100 epoch nnPU pretraining budget with pre_lr=1e-3, pre_batch_size=128, and pre_wd=1e-4"
        - "source README 100 self-paced episodes with 20 inner epochs and weighted BCE updates"
        - "logistic hardness with separate labeled-positive and unlabeled-negative temperatures"
        - "Welsch self-paced weighting with separate P/U threshold schedulers"
        - "source README threshold schedule values alpha_p=0.1, alpha_n=0.11, grow_steps=5, temper_p=1.0, temper_n=1.3"
        - "no final-bias prior initialization before source-style nnPU pretraining"
      benchmark_adaptations:
        - "PU-Bench controlled dataset splits with shared public backbones"
        - "PU-Bench empirical pi_unlabeled prior from dataset metadata"
        - "pretraining restores the best source-budget epoch by validation proxy accuracy; no test labels are used for model selection"
        - "checkpoint monitor val_proxy_acc instead of source oracle validation accuracy to satisfy PU-Bench proxy-metric checkpoint policy"
        - "oracle labels are diagnostics only; no train/validation/test oracle labels are used for RobustPU selection, calibration, losses, or sample weights"
      known_limitations:
        - "Stage2 keeps the source fixed-zero prediction threshold; on controlled public backbones it can improve ranking AUC while fixed-threshold F1/precision/recall collapse to all-negative predictions"
  # Main-table policy: source-aligned RobustPU trainer on PU-Bench's controlled
  # public backbones. This is not the paper/source private-backbone recipe.
  backbone_policy: "controlled"
  # Optional private source-like backbones live in train/robustpu/models.py.
  # Use only for explicitly named private-backbone ablations.
  private_backbone_arch: "auto"
  # Base loader/evaluation batch size follows the source validation batch size.
  # Pretraining and weighted training use the stage-specific sizes below.
  batch_size: 128
  seed: 42
  optimizer: "adam"
  init_bias_from_prior: false
  restore_best_pretrain: true
  label_scheme:
    true_positive_label: 1
    true_negative_label: 0
    pu_labeled_label: 1
    pu_unlabeled_label: -1
  checkpoint:
    enabled: true
    save_model: false
    monitor: "val_proxy_acc"
    mode: "max"
    early_stopping:
      enabled: true
      patience: 5
      min_delta: 0.0001

  pre_train:
    epochs: 100
    lr: 0.001
    weight_decay: 0.0001
    batch_size: 128
    loss: "nnpu"
    optimizer: "adam"
    monitor: "val_proxy_acc"
    calibration: "none"

  main_train:
    epochs: 100
    inner_epochs: 20
    lr: 0.01
    weight_decay: 0.0
    batch_size: 64
    loss: "bce"
    optimizer: "adam"
    hardness: "logistic"
    # Robust-PU paper Eq. (3) and source default use SPL-IR-Welsch.
    spl_type: "welsch"
    scheduler_p:
      type: "linear"
      alpha: 0.1
      max_thresh: 1.0
      grow_steps: 5
      temper: 1.0
    scheduler_n:
      type: "linear"
      alpha: 0.11
      max_thresh: 1.0
      grow_steps: 5
      temper: 1.3
    moving_ratio: 0.0
    restart: false
