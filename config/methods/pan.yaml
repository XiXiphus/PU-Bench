pan:
  metadata:
    method_key: "pan"
    trainer_key: "pan"
  # Source-style PAN optimizer settings from morning-dews/PAN main.py.
  lr: 0.0001
  lr_r: 0.0001
  lr_d: 0.0001
  adam_betas: [0.5, 0.999]
  weight_decay: 0.001
  batch_size: 64
  num_epochs: 120
  seed: 42
  init_bias_from_prior: false

  # Source PAN objective constants.
  pan_eps: 0.01
  loss2_weight: 0.0001

  # Checkpoint handler
  checkpoint:
    enabled: true
    save_model: false
    monitor: "val_proxy_acc"
    mode: "max"
    early_stopping:
      enabled: true
      patience: 25
      min_delta: 0.0001

  label_scheme:
    true_positive_label: 1
    true_negative_label: 0
    pu_labeled_label: 1
    pu_unlabeled_label: -1
