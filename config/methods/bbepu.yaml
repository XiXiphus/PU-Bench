bbepu:
  metadata:
    method_key: "bbepu"
    trainer_key: "bbepu"
    alignment:
      level: "controlled_adaptation"
      source_reproduction: false
      claim_note: "Not an author training-script reproduction: PU-Bench uses the author BBE estimator for U-prior estimation, then trains with the benchmark nnPU risk and public backbone."
      source_references:
        - "https://github.com/acmi-lab/PU_learning/tree/5e5e350dc0588de95a36eb952e3cf5382e786aec"
      retained_source_components:
        - "BBE mixture-proportion estimator"
        - "validation P/U score prior-estimation interface"
      benchmark_adaptations:
        - "PU-Bench nnPU risk for the supervised training loop"
        - "stage-switch prior update instead of online source-script cadence"
        - "PU-Bench public backbone, loaders, checkpoints, and proxy metrics"
  # Controlled PU-Bench hybrid: the author-source BBE estimator estimates the
  # positive fraction inside U, then PU-Bench's nnPU risk trains with it.

  # Optimizer settings
  optimizer: "adam"
  lr: 0.0003
  weight_decay: 0.0001
  batch_size: 128
  seed: 42

  # Two-stage training epochs
  warmup_epochs: 8 # Initial nnPU training with default prior
  main_epochs: 40 # BBE-guided training with adaptive prior

  # BBE (Binomial Bias Estimation) parameters
  delta: 0.1 # Confidence parameter for DKW bound
  gamma_bbe: 0.01 # Relaxation parameter for BBE
  bbe_update_freq: 0 # Disable online update; use validation-based estimate at stage switch

  # nnPU parameters
  gamma: 0.5 # nnPU gamma parameter (stabilize on text)
  beta: 0.1 # nnPU beta parameter (non-negative constraint)
  loss_type: "sigmoid" # Loss function type: "sigmoid", "logistic", "squared"
  init_bias_from_prior: false

  # Label scheme (standard for PU learning)
  label_scheme:
    true_positive_label: 1
    true_negative_label: 0
    pu_labeled_label: 1
    pu_unlabeled_label: -1

  # Checkpoint handler
  checkpoint:
    enabled: true
    save_model: false
    monitor: "val_proxy_acc"
    mode: "max"
    verbose: true
    early_stopping:
      enabled: true
      patience: 20
      min_delta: 0.0001

  # Optional: logging control
  log_interval: 1
  silence_metrics_before_epoch: 0
