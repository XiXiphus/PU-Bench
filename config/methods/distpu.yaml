          co_mixup: 5.0
  checkpoint:
    enabled: true
    save_model: false
    monitor: "val_proxy_acc"
    mode: max
    early_stopping:
      enabled: false
      patience: 10
      min_delta: 0.0001
  stages:
    warm_up:
      epochs: 60
      lr: 0.0005
      weight_decay: 0.005
      co_mu: 0.002
    mixup:
      epochs: 60
      lr: 0.00005
