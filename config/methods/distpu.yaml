distpu:
  metadata:
    method_key: "distpu"
    trainer_key: "distpu"
    alignment:
      level: "source_faithful_kernel_benchmark_wrapper"
      source_reproduction: false
      claim_note: >-
        Not an author training-script reproduction: PU-Bench keeps Dist-PU's
        two-stage label-distribution and mixup training kernel, but runs it
        through benchmark dataset splits, shared public backbones,
        checkpointing, proxy metrics, and result schemas.
      source_references:
        - "https://github.com/Ray-rui/Dist-PU-Positive-Unlabeled-Learning-from-a-Label-Distribution-Perspective/tree/cb74be1a87176fd38270873c06374e53905b7354"
      retained_source_components:
        - "warm-up stage with label-distribution loss plus entropy regularization"
        - "mixup stage initialized from source-style pseudo labels"
        - "polar proxy label-distribution loss with L1 histogram distance"
        - "source coefficients co_mu, co_entropy, co_mix_entropy, co_mixup, and alpha"
        - "source train.py dataset choices cifar-10, fmnist, and alzheimer share the same optimizer/schedule defaults"
        - "cosine annealing schedules for warm-up and mixup stages"
        - "mixup-stage pseudo-label refresh from model scores"
        - "source train/test batch sizes and eight-worker loader default"
        - "no prior-bias initialization"
      benchmark_adaptations:
        - "PU-Bench controlled dataset splits with shared public backbones"
        - "PU-Bench empirical pi_unlabeled prior from dataset metadata"
        - "PU-Bench checkpointing, proxy metrics, and result schema"
        - "validation monitor val_proxy_acc instead of source-script test accuracy logging"
        - "benchmark dataset object contract instead of author CIFAR/FashionMNIST/Alzheimer dataset factory"
        - "PU-Bench recommended dataset recipes are recorded separately from source recipes when source train.py hyperparameters are unavailable"
  # Source-aligned Dist-PU package: train/distpu/.
  # Author source file(s): distpu at cb74be1a87176fd38270873c06374e53905b7354.
  optimizer: "adam"
  lr: 0.00005
  weight_decay: 0.001
  batch_size: 256
  test_batch_size: 128
  num_workers: 8
  pin_memory: true
  seed: 42
  use_source_hparams_by_dataset: true
  source_hparams_by_dataset:
    cifar10:
      source_dataset: "cifar-10"
      source_num_labeled: 1000
      batch_size: 256
      test_batch_size: 128
      stages:
        warm_up:
          epochs: 60
          lr: 0.0005
          weight_decay: 0.005
          co_mu: 0.002
        mixup:
          epochs: 60
          lr: 0.00005
          weight_decay: 0.001
          alpha: 6.0
          co_entropy: 0.004
          co_mix_entropy: 0.04
          co_mixup: 5.0
    fashionmnist:
      source_dataset: "fmnist"
      source_num_labeled: 1000
      batch_size: 256
      test_batch_size: 128
      stages:
        warm_up:
          epochs: 60
          lr: 0.0005
          weight_decay: 0.005
          co_mu: 0.002
        mixup:
          epochs: 60
          lr: 0.00005
          weight_decay: 0.001
          alpha: 6.0
          co_entropy: 0.004
          co_mix_entropy: 0.04
          co_mixup: 5.0
    alzheimermri:
      source_dataset: "alzheimer"
      source_num_labeled: 1000
      batch_size: 256
      test_batch_size: 128
      stages:
        warm_up:
          epochs: 60
          lr: 0.0005
          weight_decay: 0.005
          co_mu: 0.002
        mixup:
          epochs: 60
          lr: 0.00005
          weight_decay: 0.001
          alpha: 6.0
          co_entropy: 0.004
          co_mix_entropy: 0.04
          co_mixup: 5.0
  use_recommended_hparams_by_dataset: true
  recommended_hparams_by_dataset:
    mnist:
      recommended_preset: "mnist_fashionmnist_source_schedule"
      recommended_basis: "source FashionMNIST two-stage schedule recorded as a MNIST grayscale-image recommended candidate"
      batch_size: 256
      test_batch_size: 128
      stages:
        warm_up:
          epochs: 60
          lr: 0.0005
          weight_decay: 0.005
          co_mu: 0.002
        mixup:
          epochs: 60
          lr: 0.00005
          weight_decay: 0.001
          alpha: 6.0
          co_entropy: 0.004
          co_mix_entropy: 0.04
          co_mixup: 5.0
    imdb:
