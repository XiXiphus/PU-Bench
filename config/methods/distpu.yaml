      alpha: 6.0
      co_entropy: 0.004
      co_mix_entropy: 0.04
      co_mixup: 5.0
  label_scheme:
    true_positive_label: 1
    true_negative_label: 0
    pu_labeled_label: 1
    pu_unlabeled_label: -1
