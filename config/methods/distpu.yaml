distpu:
  metadata:
    method_key: "distpu"
    trainer_key: "distpu"
  # Source-aligned Dist-PU package: train/distpu/.
  # Author source file(s): distpu at cb74be1a87176fd38270873c06374e53905b7354.
  optimizer: "adam"
  lr: 0.00005
  weight_decay: 0.001
  batch_size: 256
  test_batch_size: 128
  seed: 42
  checkpoint:
    enabled: true
    save_model: false
    monitor: "val_proxy_acc"
    mode: max
    early_stopping:
      enabled: false
      patience: 10
      min_delta: 0.0001
  stages:
    warm_up:
      epochs: 60
      lr: 0.0005
      weight_decay: 0.005
      co_mu: 0.002
    mixup:
      epochs: 60
      lr: 0.00005
      weight_decay: 0.001
      alpha: 6.0
      co_entropy: 0.004
      co_mix_entropy: 0.04
      co_mixup: 5.0
  label_scheme:
    true_positive_label: 1
    true_negative_label: 0
    pu_labeled_label: 1
    pu_unlabeled_label: -1
