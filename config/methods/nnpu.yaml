nnpu:
  metadata:
    method_key: "nnpu"
    trainer_key: "nnpu"
  # Source-faithful switches follow kiryor/nnPUlearning:
  # Adam optimizer, sigmoid surrogate, beta=0, gamma=1, and no prior-bias init.
  # LR, weight decay, and epoch count remain PU-Bench benchmark hyperparameters.
  optimizer: "adam"
  lr: 0.0003
  weight_decay: 0.0001
  batch_size: 256
  num_epochs: 40
  seed: 42
  loss: "sigmoid"
  gamma: 1.0
  beta: 0.0
  init_bias_from_prior: false
  label_scheme:
    true_positive_label: 1
    true_negative_label: 0
    pu_labeled_label: 1
    pu_unlabeled_label: -1
  checkpoint:
    enabled: true
    save_model: false
    monitor: "val_proxy_acc"
    mode: "max"
    early_stopping:
      enabled: true
      patience: 10
      min_delta: 0.0001
