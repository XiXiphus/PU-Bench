nnpu:
  metadata:
    method_key: "nnpu"
    trainer_key: "nnpu"
    alignment:
      level: "source_faithful_kernel_benchmark_wrapper"
      source_reproduction: false
      claim_note: >-
        Not an author training-script reproduction: PU-Bench keeps the Kiryo
        nnPU risk estimator semantics, label convention, and U-prior meaning,
        but runs the single-model trainer through benchmark dataset splits,
        public backbones, checkpointing, proxy metrics, and result schemas.
      source_references:
        - "https://github.com/kiryor/nnPUlearning/tree/3d9769e60dd275e8e4dcf91e1853f3b76c69f39f"
      retained_source_components:
        - "PU labels +1 for labeled positives and -1 for unlabeled samples"
        - "risk prior is the positive fraction inside U"
        - "non-negative PU risk with beta=0 and gamma=1 by default"
        - "source default sigmoid surrogate loss"
        - "source exp-mnist and exp-cifar optimizer presets when the PU-Bench dataset matches"
        - "Adam optimizer family"
        - "no prior-bias initialization"
      benchmark_adaptations:
        - "PU-Bench public backbone and controlled dataset splits"
        - "PU-Bench fallback learning rate, weight decay, batch size, and epoch budget for source-unsupported datasets"
        - "PU-Bench recommended dataset recipes are recorded separately from source recipes when source hyperparameters are unavailable"
        - "PU-Bench checkpointing, proxy metrics, and result schema"
        - "validation monitor val_proxy_acc instead of source train/test zero-one error reporting"
  # Source-faithful switches follow kiryor/nnPUlearning:
  # Adam optimizer, sigmoid surrogate, beta=0, gamma=1, and no prior-bias init.
  # Source exp-mnist/exp-cifar presets are applied at plan time when the
  # benchmark dataset matches; other datasets keep these fallback values.
  optimizer: "adam"
  lr: 0.0003
  weight_decay: 0.0001
  batch_size: 256
  num_epochs: 40
  seed: 42
  loss: "sigmoid"
  gamma: 1.0
  beta: 0.0
  use_source_hparams_by_dataset: true
  source_hparams_by_dataset:
    mnist:
      lr: 0.001
      weight_decay: 0.005
      batch_size: 30000
      num_epochs: 100
      source_preset: "exp-mnist"
      source_labeled: 1000
      source_unlabeled: 60000
    cifar10:
      lr: 0.00001
      weight_decay: 0.005
      batch_size: 500
      num_epochs: 100
      source_preset: "exp-cifar"
      source_labeled: 1000
      source_unlabeled: 50000
  use_recommended_hparams_by_dataset: true
  recommended_hparams_by_dataset:
    fashionmnist:
      recommended_preset: "fashionmnist_mnist_style"
      recommended_basis: "source exp-mnist lr/weight_decay/epoch budget with capped batch_size for public backbone memory"
      lr: 0.001
      weight_decay: 0.005
      batch_size: 500
      num_epochs: 100
    alzheimermri:
      recommended_preset: "image_default_baseline"
      recommended_basis: "PU-Bench nnPU fallback optimizer recipe recorded as an AlzheimerMRI recommended candidate"
      lr: 0.0003
      weight_decay: 0.0001
      batch_size: 256
      num_epochs: 40
    imdb:
      recommended_preset: "text_embedding_default_baseline"
      recommended_basis: "PU-Bench nnPU fallback optimizer recipe recorded as an IMDB SBERT recommended candidate"
      lr: 0.0003
      weight_decay: 0.0001
      batch_size: 256
      num_epochs: 40
    20news:
      recommended_preset: "text_embedding_default_baseline"
      recommended_basis: "Bench recommended 20News SBERT candidate; the source does not provide a 20News recipe, so this uses the PU-Bench nnPU fallback optimizer recipe"
      lr: 0.0003
      weight_decay: 0.0001
      batch_size: 256
      num_epochs: 40
    spambase:
      recommended_preset: "tabular_default_baseline"
      recommended_basis: "PU-Bench nnPU fallback optimizer recipe recorded as a Spambase recommended candidate"
      lr: 0.0003
      weight_decay: 0.0001
      batch_size: 256
      num_epochs: 40
    connect4:
      recommended_preset: "tabular_default_baseline"
      recommended_basis: "PU-Bench nnPU fallback optimizer recipe recorded as a Connect4 recommended candidate"
      lr: 0.0003
      weight_decay: 0.0001
      batch_size: 256
      num_epochs: 40
  init_bias_from_prior: false
  label_scheme:
    true_positive_label: 1
    true_negative_label: 0
    pu_labeled_label: 1
    pu_unlabeled_label: -1
  checkpoint:
    enabled: true
    save_model: false
    monitor: "val_proxy_acc"
    mode: "max"
    early_stopping:
      enabled: false
      patience: 10
      min_delta: 0.0001
