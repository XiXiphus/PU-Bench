lbe:
  metadata:
    method_key: "lbe"
    trainer_key: "lbe"
    alignment:
      level: "controlled_adaptation"
      source_reproduction: false
      claim_note: >-
        Not an author training-script reproduction: PU-Bench keeps the LBE EM
        posterior and small-loss M-step semantics, but runs them with benchmark
        loaders, shared controlled backbones, checkpointing, and proxy metrics
        instead of the author MLP training script and source dataset recipe.
      source_references:
        - "author-provided LBE_MLP source archive used for PU-Bench alignment"
      retained_source_components:
        - "E-step posterior P(y=1 | x, q)"
        - "q=1 labeled positives as hard posterior anchors"
        - "100 full-training-set Adam pretrain steps per model"
        - "10 percent whole-dataset M-step subsampling"
        - "global 80 percent small-loss classifier update"
      benchmark_adaptations:
        - "PU-Bench shared controlled backbone instead of the author MLP script"
        - "PU-Bench loaders, checkpoints, proxy metrics, and dataset splits"
        - "chunked full-dataset pretraining and M-step passes for memory control"
  # Controlled PU-Bench adaptation of author-provided LBE_MLP source:
  # author source file(s): lbe_author_provided/LBE_MLP/{train.py,em.py}.
  # Keeps the EM posterior, 10% M-step subsampling, and 80% small-loss update
  # while using shared PU-Bench backbones and loaders.
  optimizer: "adam"
  lr: 0.0005
  weight_decay: 0.0001
  batch_size: 64
  num_epochs: 20 # This will be the outer EM loop epochs
  seed: 42

  # LBE specific parameters
  # Source uses 100 full-data Adam steps per model.
  pretrain_epochs: 100
  m_steps: 20 # M-steps per EM epoch, closer to the original implementation
  # Memory- and stability-related knobs
  subset_ratio: 0.1
  topk_keep: 0.8
  m_step_train_batch_size: 512
  init_bias_from_prior: false

  label_scheme:
    true_positive_label: 1
    true_negative_label: 0
    pu_labeled_label: 1
    pu_unlabeled_label: -1 # In LBE code, this is q=0

  checkpoint:
    enabled: true
    save_model: false
    monitor: "val_proxy_acc"
    mode: "max"
    early_stopping:
      enabled: true
      patience: 5
      min_delta: 0.0001
