holisticpu:
  metadata:
    method_key: "holisticpu"
    trainer_key: "holisticpu"
  # Source: wxr99/HolisticPU@4d4ce7d6ba29722995d308293374c0f475d988d3.
  # The source uses two logits with class 0 as positive and class 1 as
  # negative/unlabeled, SGD+Nesterov, simplified trend scores, Jenks breaks,
  # EMA during phase 1, and source loss_ft in phase 2.
  # PU-Bench public backbone for fair main-table comparison.
  backbone_policy: "controlled"
  expand_labels: false  # source also expands automatically when n_labeled < batch_size
  init_bias_from_prior: false
  optimizer: "sgd"
  lr: 0.01
  weight_decay: 0.0005
  momentum: 0.9
  nesterov: true
  batch_size: 64
  num_workers: 4  # source main.py default --num-workers
  phase1_epochs: 15
  phase2_epochs: 25
  eval_step: 512
  seed: 42
  warmup_steps: 0
  rho: 0.1
  mu: 1
  T: 1.0
  threshold: 0.9
  use_ema: true
  ema_decay: 0.999
  use_three_sigma: true
  trend_filter_threshold: 0.022222222222222223  # source utils/misc.py: 0.2 / 9
  allow_small_batch_fallback: false
  # Image datasets use HolisticPU's weak/strong augmentation recipe. Vector
  # datasets use this benchmark-specific weak/strong extension, not an exact
  # reproduction of the source image recipe.
  vec_weak_noise_std: 0.0
  vec_weak_dropout: 0.0
  vec_strong_noise_std: 0.0
  vec_strong_dropout: 0.0
  vec_sign_flip_ratio: 0.0
  label_scheme:
    true_positive_label: 1
    true_negative_label: 0
    pu_labeled_label: 1
    pu_unlabeled_label: -1
  checkpoint:
    enabled: true
    save_model: false
    monitor: "val_proxy_acc"
    mode: "max"
    early_stopping:
      enabled: false
      patience: 20
      min_delta: 0.0001
