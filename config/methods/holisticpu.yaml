holisticpu:
  metadata:
    method_key: "holisticpu"
    trainer_key: "holisticpu"
    alignment:
      level: "mixed_controlled_adaptation"
      source_reproduction: false
      claim_note: >-
        Not an author training-script reproduction: the image path retains the
        active HolisticPU two-stage trend/partition/fine-tuning recipe, while
        PU-Bench uses benchmark loaders, public backbones by default, proxy
        checkpoints, and benchmark-specific vector/tabular extensions.
      source_references:
        - "https://github.com/wxr99/HolisticPU/tree/4d4ce7d6ba29722995d308293374c0f475d988d3"
      retained_source_components:
        - "two-logit classifier with class 0 as positive"
        - "phase-1 positive-versus-unlabeled trend scoring"
        - "Jenks partitioning with the source three_sigma filter"
        - "phase-2 loss_ft soft-label/consistency objective"
        - "source-style weak/strong image augmentation recipe"
        - "source run.sh dataset recipes for source-supported image datasets"
      benchmark_adaptations:
        - "PU-Bench public backbone by default for main-table comparison"
        - "PU-Bench loaders, checkpoints, proxy metrics, and dataset splits"
        - "source run.sh dataset recipes are applied at plan time for Bench-supported source datasets"
        - "benchmark-specific weak/strong augmentation for vector and tabular datasets"
        - "PU-Bench recommended dataset recipes are recorded separately from source recipes when source run.sh hyperparameters are unavailable"
      modality_alignment:
        image: "source_aligned_recipe_with_controlled_backbone"
        vector_tabular: "benchmark_specific_extension"
  # Source: wxr99/HolisticPU@4d4ce7d6ba29722995d308293374c0f475d988d3.
  # The source uses two logits with class 0 as positive and class 1 as
  # negative/unlabeled, SGD+Nesterov, simplified trend scores, Jenks breaks,
  # EMA during phase 1, and source loss_ft in phase 2.
  # PU-Bench public backbone for fair main-table comparison.
  backbone_policy: "controlled"
  expand_labels: false  # source also expands automatically when n_labeled < batch_size
  init_bias_from_prior: false
  optimizer: "sgd"
  # Fallback only. Source-supported image datasets are resolved from run.sh below.
  lr: 0.01
  use_source_hparams_by_dataset: true
  source_hparams_by_dataset:
    cifar10:
      source_dataset: "cifar10_1"
      source_num_labeled: 1000
      source_arch: "CNN_CIFAR"
      lr: 0.0015
      batch_size: 64
      eval_step: 512
      phase1_epochs: 15
      phase2_epochs: 25
      total_steps: 12800
      warmup_steps: 0
      rho: 0.1
    fashionmnist:
      source_dataset: "fmnist"
      source_num_labeled: 1000
      source_arch: "LeNet"
      source_label_split_exact_match: false
      lr: 0.002
      batch_size: 64
      eval_step: 512
      phase1_epochs: 15
      phase2_epochs: 25
      total_steps: 12800
      warmup_steps: 0
      rho: 0.1
    alzheimermri:
      source_dataset: "alzheimer"
      source_num_labeled: 769
      source_arch: "ResNet50"
      lr: 0.0005
      batch_size: 16
      eval_step: 100
      phase1_epochs: 10
      phase2_epochs: 20
      total_steps: 2000
      warmup_steps: 0
      rho: 0.1
  use_recommended_hparams_by_dataset: true
  recommended_hparams_by_dataset:
    mnist:
      recommended_preset: "mnist_fashionmnist_style"
      recommended_basis: "source FashionMNIST run.sh recipe used as a MNIST grayscale-image recommended candidate"
      lr: 0.002
      batch_size: 64
      eval_step: 512
      phase1_epochs: 15
      phase2_epochs: 25
      total_steps: 12800
      warmup_steps: 0
      rho: 0.1
    imdb:
      recommended_preset: "vector_default_short_eval"
      recommended_basis: "HolisticPU benchmark vector extension with source optimizer defaults and reduced eval_step recorded as an IMDB SBERT recommended candidate"
      lr: 0.01
      batch_size: 64
      eval_step: 128
      phase1_epochs: 15
      phase2_epochs: 25
      total_steps: 5120
      warmup_steps: 0
      rho: 0.1
    20news:
      recommended_preset: "vector_default_short_eval"
      recommended_basis: "Bench recommended 20News SBERT candidate; the source does not provide a 20News recipe, so this uses the HolisticPU benchmark vector extension with source optimizer defaults and reduced eval_step"
      lr: 0.01
      batch_size: 64
      eval_step: 128
      phase1_epochs: 15
      phase2_epochs: 25
      total_steps: 5120
      warmup_steps: 0
      rho: 0.1
    spambase:
      recommended_preset: "vector_default_short_eval"
      recommended_basis: "HolisticPU benchmark vector/tabular extension with source optimizer defaults and reduced eval_step recorded as a Spambase recommended candidate"
      lr: 0.01
      batch_size: 64
      eval_step: 128
      phase1_epochs: 15
      phase2_epochs: 25
      total_steps: 5120
      warmup_steps: 0
      rho: 0.1
    connect4:
      recommended_preset: "vector_default_short_eval"
      recommended_basis: "HolisticPU benchmark vector/tabular extension with source optimizer defaults and reduced eval_step recorded as a Connect4 recommended candidate"
      lr: 0.01
      batch_size: 64
      eval_step: 128
      phase1_epochs: 15
      phase2_epochs: 25
      total_steps: 5120
      warmup_steps: 0
      rho: 0.1
  weight_decay: 0.0005
  momentum: 0.9
  nesterov: true
  batch_size: 64
  num_workers: 4  # source main.py default --num-workers
  phase1_epochs: 15
  phase2_epochs: 25
  eval_step: 512
  seed: 42
  warmup_steps: 0
  rho: 0.1
  mu: 1
  T: 1.0
  threshold: 0.9
  use_ema: true
  ema_decay: 0.999
  use_three_sigma: true
  trend_filter_threshold: 0.022222222222222223  # source utils/misc.py: 0.2 / 9
  allow_small_batch_fallback: false
  # Image datasets use HolisticPU's weak/strong augmentation recipe. Vector
  # datasets use this benchmark-specific weak/strong extension, not an exact
  # reproduction of the source image recipe.
  vec_weak_noise_std: 0.0
  vec_weak_dropout: 0.0
  vec_strong_noise_std: 0.0
  vec_strong_dropout: 0.0
  vec_sign_flip_ratio: 0.0
  label_scheme:
    true_positive_label: 1
    true_negative_label: 0
    pu_labeled_label: 1
    pu_unlabeled_label: -1
  checkpoint:
    enabled: true
    save_model: false
    monitor: "val_proxy_acc"
    mode: "max"
    early_stopping:
      enabled: false
      patience: 20
      min_delta: 0.0001
