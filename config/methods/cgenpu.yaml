cgenpu:
  metadata:
    method_key: "cgenpu"
    trainer_key: "cgenpu"
    alignment:
      level: "source_adapted_kernel_benchmark_wrapper"
      source_reproduction: false
      claim_note: >-
        Not an author training-script reproduction: PU-Bench ports the
        TensorFlow CGenPU D/A/G training kernel to PyTorch, then runs it through
        benchmark dataset splits, public backbones, checkpointing, proxy
        metrics, and result schemas.
      source_references:
        - "https://github.com/apapich/CGenPU/tree/ca6cc9d7b0dffd1736a3662d421633d29051f7c1"
      retained_source_components:
        - "D, auxiliary A, then G update order for each unlabeled batch"
        - "separate labeled-positive xp stream and unlabeled xu stream"
        - "positive latent class one-hot index 0 and negative index 1"
        - "uniform or normal latent z generator"
        - "KLD auxiliary classifier alignment terms"
        - "generator loss that fools D and aligns A"
        - "Adam beta1/beta2 source defaults"
        - "configurable mean versus sum KLD reduction"
      benchmark_adaptations:
        - "PyTorch port of the TensorFlow source implementation"
        - "PU-Bench public backbones and controlled dataset splits"
        - "PU-Bench checkpointing, proxy metrics, and result schema"
        - "validation monitor val_proxy_acc instead of source WandB/image callback logging"
        - "benchmark-specific vector/text, MNIST, CIFAR, and AlzheimerMRI model adapters"
        - "benchmark-only prior regularization, prior-bias init, and ADNI augmentation remain disabled by default"
  # Source-adapted PyTorch CGenPU package: train/cgenpu/.
  # Author source file(s): cgenpu/pu/CGenPU.py and pu/misc/utils.py.

  # Training
  seed: 42
  num_epochs: 200
  batch_size: 128
  lr: 1.0e-4
  beta1: 0.5
  beta2: 0.999

  # Generator noise
  latent_dim: 256
  z_type: "uniform" # "uniform" | "normal"
  # Generator output activation for vector/text: tanh keeps range in [-1,1]
  gen_out_activation: tanh

  # Auxiliary classifier weight
  aux_strength: 1.0
  # Benchmark-only conveniences, disabled by default for source-like runs.
  prior_reg: 0.0
  prior_bias_init: false
  adni_aug_flip_prob: 0.0
  adni_aug_noise_std: 0.0

  # KL divergence reduction method (true for mean, false for sum)
  # Matches original TF implementation's 'mean' parameter
  reduce_mean: true

  # Checkpoint
  checkpoint:
    enabled: true
    save_model: false
    monitor: "val_proxy_acc"
    mode: "max"
    early_stopping:
      enabled: false
      patience: 30
      min_delta: 0.0001

  # Label scheme for PU datasets (stay consistent with others)
  label_scheme:
    true_positive_label: 1
    true_negative_label: 0
    pu_labeled_label: 1
    pu_unlabeled_label: -1
