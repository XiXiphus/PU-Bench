pulda:
  metadata:
    method_key: "pulda"
    trainer_key: "pulda"
    alignment:
      level: "source_faithful_kernel_benchmark_wrapper"
      source_reproduction: false
      claim_note: >-
        Not an author training-script reproduction: PU-Bench keeps PULDA's
        label-distribution alignment, EMA, two-way sigmoid, P/U resampling,
        and mixup training kernel, but runs it through controlled dataset
        splits, shared public backbones, checkpointing, proxy metrics, and
        result schemas.
      source_references:
        - "https://github.com/jiangyangby/PULDA/tree/7b3dcad95bd7caa0a9477af37a05764fbe6e27bc"
      retained_source_components:
        - "warm-up stage with label-distribution alignment and two-way sigmoid loss"
        - "EMA estimates for unlabeled expectation and negative-class margin terms"
        - "fixed P/U resampling batches with P_batch_size=16 and U_batch_size=128"
        - "mixup stage initialized from source-style pseudo scores"
        - "source train.py CIFAR-10-only optimizer and schedule recipe"
        - "source coefficients co_mixup=4.2, alpha=11.0, tmpr=3.5, alpha_U=0.85, and alpha_CN=0.5"
        - "source train/test batch sizes and eight-worker loader default"
        - "no prior-bias initialization"
      benchmark_adaptations:
        - "PU-Bench controlled dataset splits with shared public backbones"
        - "PU-Bench empirical pi_unlabeled prior from dataset metadata"
        - "PU-Bench checkpointing, proxy metrics, and result schema"
        - "validation monitor val_proxy_acc instead of source-script test accuracy logging"
        - "benchmark dataset object contract instead of author CIFAR-only dataset factory"
        - "PU-Bench recommended dataset recipes are recorded separately from the source CIFAR-10 recipe"
      modality_alignment:
        image: "source_aligned_recipe_with_controlled_backbone"
        vector_tabular: "benchmark_specific_extension"
  # Source-aligned trainer with PU-Bench controlled public backbones.
  # Official code: jiangyangby/PULDA @ 7b3dcad95bd7caa0a9477af37a05764fbe6e27bc.
  # Optimizer settings (alignment stage)
  optimizer: "adam"
  lr: 0.001 # Alignment stage learning rate
  weight_decay: 0.0001 # Alignment stage weight decay (original ~1e-4)
  batch_size: 256 # Original paper uses 256 (can reduce for memory constraints)
  test_batch_size: 128
  num_workers: 8
  pin_memory: true
  num_epochs: 120 # Total epochs (warm-up + alignment), original ~60+60
  seed: 42
  use_source_hparams_by_dataset: true
  source_hparams_by_dataset:
    cifar10:
      source_dataset: "cifar-10"
      source_num_labeled: 1000
      batch_size: 256
      test_batch_size: 128
      warm_up_lr: 0.0001
      lr: 0.001
      warm_up_weight_decay: 0.0005
      weight_decay: 0.0001
      warm_up_epochs: 60
      pu_epochs: 60
      tmpr: 3.5
      two_way: 1
      margin: 0.6
      EMA: 1
      alpha_U: 0.85
      alpha_CN: 0.5
      co_mixup: 4.2
      alpha: 11.0
      resample: 1
      P_batch_size: 16
      U_batch_size: 128
  use_recommended_hparams_by_dataset: true
  recommended_hparams_by_dataset:
    mnist:
      recommended_preset: "image_cifar10_schedule_bce_warmup"
      recommended_basis: "source PULDA CIFAR-10 optimizer and alignment schedule with benchmark BCE warm-up for a MNIST grayscale-image recommended candidate"
      batch_size: 256
      test_batch_size: 128
      warmup_loss: "bce"
      warm_up_lr: 0.0001
      lr: 0.001
      warm_up_weight_decay: 0.0005
      weight_decay: 0.0001
      warm_up_epochs: 60
      pu_epochs: 60
      tmpr: 3.5
      two_way: 1
      margin: 0.6
      EMA: 1
      alpha_U: 0.85
      alpha_CN: 0.5
      co_mixup: 4.2
      alpha: 11.0
      resample: 1
      P_batch_size: 16
      U_batch_size: 128
    fashionmnist:
      recommended_preset: "image_cifar10_schedule_bce_warmup"
      recommended_basis: "source PULDA CIFAR-10 optimizer and alignment schedule with benchmark BCE warm-up for a FashionMNIST grayscale-image recommended candidate"
      batch_size: 256
      test_batch_size: 128
      warmup_loss: "bce"
      warm_up_lr: 0.0001
      lr: 0.001
      warm_up_weight_decay: 0.0005
      weight_decay: 0.0001
      warm_up_epochs: 60
      pu_epochs: 60
      tmpr: 3.5
      two_way: 1
      margin: 0.6
      EMA: 1
      alpha_U: 0.85
      alpha_CN: 0.5
      co_mixup: 4.2
      alpha: 11.0
      resample: 1
      P_batch_size: 16
      U_batch_size: 128
    alzheimermri:
      recommended_preset: "image_cifar10_schedule_bce_warmup"
      recommended_basis: "source PULDA CIFAR-10 optimizer and alignment schedule with benchmark BCE warm-up for an AlzheimerMRI image recommended candidate"
      batch_size: 256
      test_batch_size: 128
      warmup_loss: "bce"
      warm_up_lr: 0.0001
      lr: 0.001
      warm_up_weight_decay: 0.0005
      weight_decay: 0.0001
      warm_up_epochs: 60
      pu_epochs: 60
      tmpr: 3.5
      two_way: 1
      margin: 0.6
      EMA: 1
      alpha_U: 0.85
      alpha_CN: 0.5
      co_mixup: 4.2
      alpha: 11.0
      resample: 1
      P_batch_size: 16
      U_batch_size: 128
    imdb:
      recommended_preset: "vector_cifar10_schedule_bce_warmup"
      recommended_basis: "source PULDA CIFAR-10 optimizer and alignment schedule with benchmark BCE warm-up for an IMDB SBERT recommended candidate"
      batch_size: 256
      test_batch_size: 128
      warmup_loss: "bce"
      warm_up_lr: 0.0001
      lr: 0.001
      warm_up_weight_decay: 0.0005
      weight_decay: 0.0001
      warm_up_epochs: 60
      pu_epochs: 60
      tmpr: 3.5
      two_way: 1
      margin: 0.6
      EMA: 1
      alpha_U: 0.85
      alpha_CN: 0.5
      co_mixup: 4.2
      alpha: 11.0
      resample: 1
      P_batch_size: 16
      U_batch_size: 128
    20news:
      recommended_preset: "vector_cifar10_schedule_bce_warmup"
      recommended_basis: "Bench recommended 20News SBERT candidate; the source does not provide a 20News recipe, so this reuses PULDA CIFAR-10 optimizer/alignment constants with benchmark BCE warm-up"
      batch_size: 256
      test_batch_size: 128
      warmup_loss: "bce"
      warm_up_lr: 0.0001
      lr: 0.001
      warm_up_weight_decay: 0.0005
      weight_decay: 0.0001
      warm_up_epochs: 60
      pu_epochs: 60
      tmpr: 3.5
      two_way: 1
      margin: 0.6
      EMA: 1
      alpha_U: 0.85
      alpha_CN: 0.5
      co_mixup: 4.2
      alpha: 11.0
      resample: 1
      P_batch_size: 16
      U_batch_size: 128
    spambase:
      recommended_preset: "vector_cifar10_schedule_bce_warmup"
      recommended_basis: "source PULDA CIFAR-10 optimizer and alignment schedule with benchmark BCE warm-up for a Spambase recommended candidate"
      batch_size: 256
      test_batch_size: 128
      warmup_loss: "bce"
      warm_up_lr: 0.0001
      lr: 0.001
      warm_up_weight_decay: 0.0005
      weight_decay: 0.0001
      warm_up_epochs: 60
      pu_epochs: 60
      tmpr: 3.5
      two_way: 1
      margin: 0.6
      EMA: 1
      alpha_U: 0.85
      alpha_CN: 0.5
      co_mixup: 4.2
      alpha: 11.0
      resample: 1
      P_batch_size: 16
      U_batch_size: 128
    connect4:
      recommended_preset: "vector_cifar10_schedule_bce_warmup"
      recommended_basis: "source PULDA CIFAR-10 optimizer and alignment schedule with benchmark BCE warm-up for a Connect4 recommended candidate"
      batch_size: 256
      test_batch_size: 128
      warmup_loss: "bce"
      warm_up_lr: 0.0001
      lr: 0.001
      warm_up_weight_decay: 0.0005
      weight_decay: 0.0001
      warm_up_epochs: 60
      pu_epochs: 60
      tmpr: 3.5
      two_way: 1
      margin: 0.6
      EMA: 1
      alpha_U: 0.85
      alpha_CN: 0.5
      co_mixup: 4.2
      alpha: 11.0
      resample: 1
      P_batch_size: 16
      U_batch_size: 128

  # Warm-up stage optimizer settings
  warm_up_lr: 0.0001 # Warm-up stage learning rate (original ~1e-4)
  warm_up_weight_decay: 0.0005 # Warm-up stage weight decay (original ~5e-4)

  # PULDA specific loss parameters
  tmpr: 3.5 # Temperature for softplus distance
  two_way: 1 # Enable two-way sigmoid loss
  margin: 0.6 # Margin for two-way sigmoid loss

  # EMA parameters (Exponential Moving Average)
  EMA: 1 # Enable EMA (1=True, 0=False)
  alpha_U: 0.85 # EMA momentum for unlabeled predictions
  alpha_CN: 0.5 # EMA momentum for negative class margin loss

  # PULDA specific training schedule
  warmup_loss: "lda" # Source default; set to "bce" only as an explicit benchmark convenience.
  warm_up_epochs: 60 # Original implementation
  pu_epochs: 60 # Original implementation

  # Mixup parameters
  co_mixup: 4.2 # Mixup loss coefficient
  alpha: 11.0 # Beta distribution alpha for mixup

  # Resampling settings (optional, for balanced P/U batches)
  resample: 1 # Enable P/U resampling (1=True, 0=False)
  P_batch_size: 16 # Positive batch size when resampling
  U_batch_size: 128 # Unlabeled batch size when resampling

  # Checkpoint handler
  checkpoint:
    save_model: false
    enabled: true
    monitor: "val_proxy_acc"
    mode: "max"
    early_stopping:
      enabled: false # Source schedule runs fixed warm_up_epochs + pu_epochs.
      patience: 20
      min_delta: 0.0001

  label_scheme:
    true_positive_label: 1
    true_negative_label: 0
    pu_labeled_label: 1
    pu_unlabeled_label: -1
