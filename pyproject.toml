[project]
name = "pu-bench"
version = "0.1.0"
description = "Unified positive-unlabeled learning benchmark"
requires-python = ">=3.11"
dependencies = [
    "datasets>=2.20",
    "jenkspy>=0.4",
    "joblib>=1.3",
    "liac-arff>=2.5",
    "numpy>=1.26",
    "pandas>=2.2",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "scikit-learn>=1.3",
    "scipy>=1.11",
    "sentence-transformers>=3.0",
    "tabulate>=0.9",
    "torch>=2.0",
    "torchvision>=0.15",
    "tqdm>=4.66",
]

[tool.uv]
package = false
